<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"><title>Concluir autorização • 3D LABZ Studio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07141e;color:#eaf4fa;font:16px/1.6 system-ui,Segoe UI,sans-serif}main{max-width:720px;margin:8vh auto;padding:32px;background:#102633;border:1px solid #254655;border-radius:18px}.brand{color:#00d7e8;font-weight:800;letter-spacing:3px}h1{font-size:30px;line-height:1.25}p{color:#b3cbd8}button{padding:14px 24px;border:0;border-radius:9px;background:#00cbdc;color:#06222a;font:700 16px system-ui;cursor:pointer}button:disabled{opacity:.4;cursor:default}textarea{width:100%;height:110px;margin:20px 0;border:1px solid #355462;border-radius:8px;padding:12px;background:#07141e;color:#c3dae5;overflow-wrap:anywhere}small{display:block;color:#93abba;margin-top:22px}@media(max-width:760px){main{margin:24px 16px;padding:24px}}</style></head>
<body><main><div class="brand">3D LABZ STUDIO</div><h1 id="title">Retorno da autorização Shopee</h1><p id="status">Abra a autorização pelo programa Windows para continuar.</p><button id="copy" disabled>Copiar retorno para a V9</button><textarea id="return" readonly hidden aria-label="URL temporária de retorno" spellcheck="false"></textarea><small>Conclua somente no diálogo de autorização da V9. Não envie esse retorno em chats ou chamados de suporte. Esta página não solicita senha ou chave de API.</small></main>
<script>
(() => {
  const returned = window.location.href;
  const params = new URL(returned).searchParams;
  const code = params.get('code'), shop = params.get('shop_id'), state = params.get('state');
  const valid = Boolean(code && /^[0-9]+$/.test(shop || '') && /^[A-Za-z0-9_-]{24,}$/.test(state || ''));
  const button = document.getElementById('copy'), field = document.getElementById('return'), status = document.getElementById('status');
  // Retira a query do histórico visível; nenhum dado é enviado por este script.
  window.history.replaceState(null, '', window.location.pathname);
  if (!valid) return;
  document.getElementById('title').textContent = 'Retorno recebido';
  status.textContent = 'Copie o retorno, volte ao diálogo Autorizar Shopee na V9, cole no campo de URL e clique em Concluir autorização.';
  button.disabled = false;
  button.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(returned);
      status.textContent = 'Retorno copiado. Cole no diálogo de autorização da V9 e conclua.';
    } catch (_) {
      field.hidden = false; field.value = returned; field.focus(); field.select();
      status.textContent = 'Selecione o texto abaixo e use Ctrl+C. Cole no diálogo de autorização da V9.';
    }
  });
})();
</script></body></html>
